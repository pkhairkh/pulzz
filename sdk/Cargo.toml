[package]
name = "pulzz-sdk"
version.workspace = true
edition.workspace = true
description = "Idiomatic async Rust SDK for pulzZ predictive-memory transport."
license.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
shared_protocol = { path = "../shared_protocol" }
client = { path = "../client" }
serde = { workspace = true }
thiserror = { workspace = true }
rand = { workspace = true }

# Native-only: tokio (with "net") + server crate pull in quinn/rustls/aws-lc-sys
# which cannot build for wasm32-unknown-unknown (no <sys/types.h>).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
server = { path = "../server" }
tokio = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "net", "time", "io-util"] }
rand = { workspace = true }
pulzz-ffi = { path = "../ffi" }
server = { path = "../server" }
shared_protocol = { path = "../shared_protocol" }
client = { path = "../client" }
futures-util = { workspace = true }
tokio-tungstenite = { workspace = true }

[lib]
name = "pulzz_sdk"
path = "src/lib.rs"
