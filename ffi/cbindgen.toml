# cbindgen config for the pulzz C ABI header.
# Run from repo root: `cbindgen --crate pulzz-ffi --output ffi/include/pulzz.h --config ffi/cbindgen.toml`

language = "C"
header = "/* pulzZ C ABI — auto-generated by cbindgen. Do not edit. */"
include_guard = "PULZZ_H"
includes = ["stddef.h", "stdint.h"]
autogen_warning = "/* Warning: this file is auto-generated by cbindgen. Do not edit. */"
tab_width = 4
style = "type"
usize_is_size_t = true

[parse]
parse_deps = false
include = []
clean = false

[parse.expand]
crates = []

[export]
include = []
exclude = []

[fn]
prefix = ""
rename_args = "None"

[struct]
associated_constants_in_body = true

[enum]
prefix_with_name = false
rename_variants = "None"
add_sentinel = false

[macro_expansion]
bitflags = false

[defines]
"target_os = linux" = "PULZZ_OS_LINUX"
"target_os = macos" = "PULZZ_OS_MACOS"
"target_os = windows" = "PULZZ_OS_WINDOWS"
