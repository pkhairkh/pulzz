[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "pulzz-python"
version = "0.4.0"
description = "Python binding for pulzZ SDK via PyO3"
requires-python = ">=3.8"

[tool.maturin]
# The Rust crate's lib name is `pulzz_python`; maturin will rename the
# resulting Python module to `pulzz` so users `import pulzz`.
module-name = "pulzz"
