[workspace]
members = ["client", "server", "shared_protocol", "sdk", "ffi", "bindings/wasm", "bindings/python", "benchmarks/collab_doc"]
resolver = "2"

[workspace.package]
version = "0.6.0"
edition = "2024"
description = "Predictive-memory transport for exact-state state across browser and native clients with mutual post-quantum authenticated sessions."
repository = "https://github.com/pkhairkh/pulzz.git"
license = "CCL-X-1.2"
publish = false

[workspace.dependencies]
async-trait = "0.1"
bytes = "1.7"
chacha20poly1305 = { version = "0.10", default-features = false, features = ["std"] }
constriction = "0.4.2"
futures-util = "0.3"
half = { version = "2.4", features = ["serde"] }
hkdf = "0.12"
indicatif = "0.17"
indexmap = "2"
ml-dsa = "0.1.0-rc.8"
ml-kem = "0.3.0-rc.2"
quinn = "0.11"
rand = "0.8"
rand_core = "0.6"
rcgen = "0.14"
rustls = "0.23"
bincode = { version = "2", features = ["serde", "alloc", "std"] }
serde = { version = "1.0", features = ["derive"] }
serde-big-array = "0.5"
serde_json = "1.0"
sha2 = "0.10"
thiserror = "1.0"
tokio = { version = "1.39", features = ["macros", "rt-multi-thread", "sync", "net", "time", "io-util"] }
tokio-tungstenite = "0.29"
url = "2.5"
webtrans-quinn = "0.4.0"
webtrans-wasm = "0.4.0"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
zstd = { version = "0.13", features = ["zdict_builder"] }
