[package]
name = "client"
version.workspace = true
edition.workspace = true
description.workspace = true
repository.workspace = true
license.workspace = true
publish = false

[lib]
# rlib only — the cdylib output was never consumed (no #[no_mangle] in this
# crate) and triggered wasm32 PIC relocation errors against the precompiled
# Rust std rlib. Consumers that need a wasm cdylib should use the
# `pulzz-wasm` binding crate in bindings/wasm/.
crate-type = ["rlib"]

[dependencies]
async-trait.workspace = true
bincode.workspace = true
bytes.workspace = true
futures-util.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
shared_protocol = { path = "../shared_protocol" }
thiserror.workspace = true
url.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
quinn.workspace = true
rustls.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
webtrans-quinn.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
futures-channel = "0.3"
getrandom = { version = "0.2", features = ["js"] }
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
webtrans-wasm.workspace = true
web-sys = { version = "0.3", features = [
  "BinaryType",
  "Crypto",
  "CloseEvent",
  "ErrorEvent",
  "Event",
  "CryptoKey",
  "DomStringList",
  "IdbDatabase",
  "IdbFactory",
  "IdbObjectStore",
  "IdbOpenDbRequest",
  "IdbRequest",
  "IdbTransaction",
  "IdbTransactionMode",
  "MessageEvent",
  "Navigator",
  "Performance",
  "ReadableStream",
  "ReadableStreamDefaultReader",
  "Response",
  "SubtleCrypto",
  "WebSocket",
  "Window",
  # WebTransport features required by transitive dep `webtrans-wasm`.
  # Without these, webtrans-wasm fails to compile with unresolved import
  # errors for WebTransport / WebTransportError / etc.
  "WebTransport",
  "WebTransportError",
  "WebTransportErrorOptions",
  "WebTransportErrorSource",
  "WebTransportBidirectionalStream",
  "WebTransportSendStream",
  "WebTransportReceiveStream",
  "WebTransportDatagramDuplexStream",
  "WebTransportOptions",
  "WebTransportHash",
  "WebTransportCongestionControl",
  "WebTransportCloseInfo",
  "WritableStream",
  "WritableStreamDefaultWriter",
] }
