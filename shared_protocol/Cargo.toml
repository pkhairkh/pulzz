[package]
name = "shared_protocol"
version.workspace = true
edition.workspace = true
description.workspace = true
repository.workspace = true
license.workspace = true
publish = false

[dependencies]
async-trait.workspace = true
chacha20poly1305.workspace = true
constriction.workspace = true
half.workspace = true
hkdf.workspace = true
ml-dsa.workspace = true
ml-kem.workspace = true
postcard = { version = "1", features = ["alloc"] }
rand_core.workspace = true
bincode.workspace = true
serde.workspace = true
serde-big-array.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true

# Wave 18: zstd is optional on WASM (zstd-sys requires clang for wasm32 builds).
# Native builds use the full P0-P5 compression pipeline; WASM builds fall back
# to uncompressed payloads (the batch envelope format is still valid, just
# without whole-batch zstd compression).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
zstd.workspace = true
tokio.workspace = true
x25519-dalek.workspace = true

[dev-dependencies]
rand.workspace = true
